<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4; /* Soft light gray background */
            margin: 0;
            padding: 20px;
            color: #333; /* Dark text for readability */
        }

        h1 {
            text-align: center;
            color: #2c3e50; /* Mild dark gray for heading */
            margin-bottom: 20px;
        }

        .contact-section {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff; /* White background for contact details */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .contact-section p {
            margin: 10px 0;
            color: #555; /* Medium gray for text */
        }

        .contact-section a {
            color: #4CAF50; /* Soft green for links */
            text-decoration: none;
        }

        .contact-section a:hover {
            text-decoration: underline; /* Underline on hover */
        }
    </style>
</head>
<body>

<h1>Contact Us</h1>

<section class="contact-section">
    <h2>Contact Details</h2>
    <p><i class="fas fa-phone"></i> +91 9000090000</p>
    <p><i class="fas fa-envelope"></i> jpp@example.com</p>
    <p>Follow us on <a href="https://www.instagram.com/jp_photographyyyy_/">Instagram</a></p>
</section>

</body>
</html>
