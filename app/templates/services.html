<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Services</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            color: #FFFFFF;
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 36px;
            color: #FFD700;
            margin: 30px 0;
            letter-spacing: 1.5px;
            text-align: center;
        }

        /* Form Styling */
        form {
            margin-bottom: 20px;
        }

        select {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #FFD700;
            background-color: #333333;
            color: #FFD700;
            font-size: 1rem;
            outline: none;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        select:hover, select:focus {
            background-color: #444444;
            border-color: #FFD700;
        }

        /* Service Container */
        .service-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            margin-bottom: 40px;
        }

        .service-block {
            background-color: #333333;
            border: 1px solid #FFD700;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .service-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.5);
        }

        .service-block h3 {
            color: #FFD700;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .service-block p {
            color: #BBBBBB;
            font-size: 1rem;
            margin-bottom: 5px;
        }

        /* Back Button Styling */
        .back-button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #FFD700;
            color: #111111;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .back-button:hover {
            background-color: #FFC107;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
        }

    </style>
</head>
<body>

<h1>Available Services</h1>

<form method="GET" action="{{ url_for('home.services') }}">
    <select name="category" onchange="this.form.submit()">
        {% for cat in categories %}
            <option value="{{ cat }}" {% if selected_category == cat %}selected{% endif %}>
                {{ cat }}
            </option>
        {% endfor %}
    </select>
</form>

<div class="service-container">
    {% for service in services %}
        <div class="service-block">
            <h3>{{ service.name }}</h3>
            <p>{{ service.description }}</p>
            <p><strong>Advance: </strong>{{ service.advance }}</p>
        </div>
    {% else %}
        <p>No available services in this category.</p>
    {% endfor %}
</div>

<a href="{{ url_for('home.home') }}" class="back-button">Back to Home</a>

</body>
</html>
